[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hackalem-ai-service"
version = "0.1.0"
description = "Offline meeting transcription, diarization and action-item extraction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "alem-contract==0.1.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "pydantic==2.10.6",
  "python-docx==1.1.2",
  "python-multipart==0.0.20",
  "reportlab==4.2.5",
  "tzdata==2025.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
ml = [
  "faster-whisper==1.1.1",
  "huggingface-hub==0.28.1",
  "matplotlib==3.10.6",
  "pyannote.audio==3.3.2",
  "torch==2.5.1",
  "torchaudio==2.5.1",
]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
