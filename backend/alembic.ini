[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Overridden by DATABASE_URL in migrations/env.py; this is a placeholder only.
sqlalchemy.url = postgresql+psycopg://user:change-me@localhost:5432/meeting_minutes

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
